<!DOCTYPE html>

<head>

  <title>Uzay Günlüğü</title>
  <meta name="theme-color" content="#010208">
  <!-- Uygulama (PWA): kimlik kartı ve ikonlar -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="ikonlar/ikon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="ikonlar/ikon-180.png">
  <!-- Fontlar: Google Fonts'tan. preconnect = bağlantıyı önceden aç, daha hızlı yüklensin -->

       tarayıcı yeni adresi önbellekte bulamaz ve dosyanın yenisini indirir. -->
  <link rel="stylesheet" href="style.css?v=13">
</head>
<body>
  <header class="ust">
    <h1>Uzay Günlüğü</h1>
    <p class="alt-baslik">Her gün evrene yeni bir pencere</p>
    <nav class="menu">
      <a href="index.html" class="aktif" aria-current="page"><span data-ikon="fotograf"></span>Günlük</a>
      <details class="menu-grup">
        <summary><span data-ikon="pusula"></span>Keşfet<span data-ikon="asagi" class="menu-ok"></span></summary>
        <div class="menu-acilir">
          <a href="gokyuzu.html"><span data-ikon="hilal"></span>Bu Gece</a>
          <a href="iss.html"><span data-ikon="iss"></span>ISS</a>
          <a href="dunya.html"><span data-ikon="dunya"></span>Dünya</a>

          <a href="dogumgunu.html"><span data-ikon="pasta"></span>Doğum Günü</a>

      </details>
      <a href="events.html"><span data-ikon="takvim"></span>Uzay Takvimi</a>

  <main class="icerik">
    <!-- Günün Bilgisi kartı (içini app.js dolduruyor) -->
    <section class="kart bilgi-karti" id="bilgi"></section>

    <!-- Günün Fotoğrafı kartı -->
    <section class="kart" id="apod">
      <div class="kart-ust">
        <h2 class="bolum-basligi"><span data-ikon="fotograf"></span>Günün Fotoğrafı</h2>
        <!-- Tarih seçici: geçmiş günlerin fotoğraflarına bakmak için -->
        <label class="tarih-secici">
          <span>Tarih</span>
          <input type="date" id="tarih" min="1995-06-16">
        </label>
      </div>
      <!-- JavaScript bu kutunun içini dolduracak -->
      <div id="apod-icerik"></div>
    </section>

    <!-- Güncel Haberler -->
    <section class="kart" id="haberler">
      <div class="kart-ust">
        <h2 class="bolum-basligi"><span data-ikon="haber"></span>Güncel Uzay Haberleri</h2>
      </div>
      <div id="haber-listesi" class="haber-izgara"></div>
    </section>
  </main>

  <footer class="alt">
    Veriler: <a href="https://science.nasa.gov/apod/" target="_blank" rel="noopener">NASA APOD</a> ·
    <a href="https://spaceflightnewsapi.net" target="_blank" rel="noopener">Spaceflight News API</a>
