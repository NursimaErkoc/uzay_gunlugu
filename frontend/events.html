<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uzay Takvimi · Uzay Günlüğü</title>
  <meta name="theme-color" content="#010208">
  <!-- Uygulama (PWA): kimlik kartı ve ikonlar -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="ikonlar/ikon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="ikonlar/ikon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Michroma&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=12">
</head>
<body>
  <header class="ust">
    <h1>Uzay Günlüğü</h1>
    <p class="alt-baslik">Gökyüzü olayları · Fırlatmalar · Görevler</p>
    <nav class="menu">
      <a href="index.html"><span data-ikon="fotograf"></span>Günlük</a>
      <details class="menu-grup">
        <summary><span data-ikon="pusula"></span>Keşfet<span data-ikon="asagi" class="menu-ok"></span></summary>
        <div class="menu-acilir">
          <a href="gokyuzu.html"><span data-ikon="hilal"></span>Bu Gece</a>
          <a href="iss.html"><span data-ikon="iss"></span>ISS</a>
          <a href="dunya.html"><span data-ikon="dunya"></span>Dünya</a>
          <a href="asteroitler.html"><span data-ikon="asteroit"></span>Asteroitler</a>
          <a href="agirlik.html"><span data-ikon="terazi"></span>Ağırlık</a>
          <a href="gokharitasi.html"><span data-ikon="takimyildiz"></span>Gök Haritası</a>
          <a href="dogumgunu.html"><span data-ikon="pasta"></span>Doğum Günü</a>
        </div>
      </details>
      <a href="events.html" class="aktif" aria-current="page"><span data-ikon="takvim"></span>Uzay Takvimi</a>
    </nav>
  </header>

  <main class="icerik">
    <section class="kart">
      <!-- Ay seçici: ‹ Aralık 2026 › -->
      <div class="ay-secici">
        <button id="onceki-ay" class="ok-butonu" aria-label="Önceki ay"><span data-ikon="sol"></span></button>
        <h2 id="ay-basligi">…</h2>
        <button id="sonraki-ay" class="ok-butonu" aria-label="Sonraki ay"><span data-ikon="sag"></span></button>
      </div>

      <!-- Görünüm seçici: Liste / Takvim  +  Hatırlatmalarım -->
      <div class="arac-cubugu">
        <div class="gorunum-secici" id="gorunum-secici">
          <button class="gorunum aktif" data-gorunum="liste"><span data-ikon="liste"></span>Liste</button>
          <button class="gorunum" data-gorunum="takvim"><span data-ikon="izgara"></span>Takvim</button>
        </div>
        <button class="hatirlatmalarim-butonu" data-eylem="hatirlatmalarim">
          <span data-ikon="zil"></span>Hatırlatmalarım <span id="hatirlatma-sayisi"></span>
        </button>
      </div>

      <!-- Filtreler -->
      <div class="filtreler" id="filtreler">
        <button class="filtre aktif" data-tur="hepsi">Hepsi</button>
        <button class="filtre" data-tur="gokyuzu"><span data-ikon="uzanim"></span>Gökyüzü</button>
        <button class="filtre" data-tur="firlatma"><span data-ikon="roket"></span>Fırlatmalar</button>
        <button class="filtre" data-tur="etkinlik"><span data-ikon="uydu"></span>Uzay Etkinlikleri</button>
      </div>
      <label class="secenek">
        <input type="checkbox" id="starlink-goster"> Starlink fırlatmalarını da göster
      </label>
      <p class="aciklama-notu">Saatler Türkiye saatine (UTC+3) göredir.</p>
    </section>

    <div id="olay-listesi"></div>
  </main>

  <!-- Ayrıntı penceresi: takvimde bir olaya tıklayınca açılır (<dialog> = tarayıcının hazır pencere elemanı) -->
  <dialog id="detay" class="detay-penceresi">
    <button class="kapat" id="detay-kapat" aria-label="Kapat"><span data-ikon="kapat"></span></button>
    <div id="detay-icerik"></div>
  </dialog>

  <footer class="alt">
    Veriler: <a href="https://thespacedevs.com/llapi" target="_blank" rel="noopener">Launch Library 2</a> ·
    Gökyüzü hesaplamaları: <a href="https://github.com/cosinekitty/astronomy" target="_blank" rel="noopener">Astronomy Engine</a>
  </footer>

  <script src="ortak.js?v=12"></script>
  <script src="events.js?v=12"></script>
</body>
</html>
