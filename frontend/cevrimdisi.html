<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Çevrimdışı · Uzay Günlüğü</title>
  <meta name="theme-color" content="#010208">
  <link rel="icon" href="ikonlar/ikon.svg" type="image/svg+xml">
  <!-- Bu sayfa internet yokken açılır: dış dosyalara (font, CSS) güvenemeyiz, her şey burada -->
  <style>
    html { background: #010208; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      color: #e6e9fb;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
      background: radial-gradient(800px 500px at 50% 0%, rgba(78, 58, 170, 0.18), transparent 60%);
    }
    main { max-width: 420px; }
    img { width: 96px; height: 96px; border-radius: 22px; }
    h1 { font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; font-size: 1.2rem; margin: 22px 0 8px; }
    p { color: #8890b8; line-height: 1.6; margin: 0 0 20px; }
    button {
      font: inherit;
      color: #0b1022;
      background: #8fa9ff;
      border: 0;
      border-radius: 999px;
      padding: 10px 22px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="ikonlar/ikon.svg" alt="">
    <h1>Çevrimdışısın</h1>
    <p>İnternet bağlantısı yok ve bu sayfanın kayıtlı bir kopyası bulunmuyor.
      Daha önce açtığın sayfalar (Günlük, Bu Gece, Takvim...) internetsiz de açılır.</p>
    <button onclick="location.reload()">Tekrar dene</button>
  </main>
</body>
</html>
